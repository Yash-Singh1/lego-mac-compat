# Meson cross file: x86_64 macOS from an arm64 Mac.  Rosetta runs the
# x86_64 build-time tools, so no exe wrapper is needed.
[binaries]
c = ['clang', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
cpp = ['clang++', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
objc = ['clang', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
objcpp = ['clang++', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
ar = 'ar'
strip = 'strip'
pkg-config = 'false'

[built-in options]
c_args = []
cpp_args = []

[properties]
needs_exe_wrapper = false

[host_machine]
system = 'darwin'
subsystem = 'macos'
kernel = 'xnu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
